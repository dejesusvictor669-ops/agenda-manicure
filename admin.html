<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#EEEBE6">
  <title>Painel</title>
  <link rel="icon" href="img/icone.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="/"><img class="logo" src="img/icone.png" alt="" width="34" height="34"><span class="brand-name"></span></a>
      <button class="btn sm ghost" id="out" hidden>Sair</button>
    </div>
  </header>

  <main>
    <form id="login" class="login" hidden>
      <img class="logo login-logo" src="img/icone.png" alt="" width="64" height="64">
      <h1>Área da profissional</h1>
      <p class="sub">Entre para gerenciar a agenda.</p>
      <label class="field" for="em">E-mail</label>
      <input type="email" id="em" autocomplete="username" required>
      <label class="field" for="pw">Senha</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <div id="msg" class="msg" role="alert"></div>
      <button class="btn">Entrar</button>
    </form>

    <div id="app" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-t="ag">Agenda</button>
        <button role="tab" data-t="cal">Calendário</button>
        <button role="tab" data-t="hr">Horários</button>
        <button role="tab" data-t="sv">Serviços</button>
        <button role="tab" data-t="lb">Avisos</button>
      </div>
      <section id="ag"></section>
      <section id="cal" hidden></section>
      <section id="hr" hidden></section>
      <section id="sv" hidden></section>
      <section id="lb" hidden></section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const DIAS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

    const el = (t, txt, c) => { const e = document.createElement(t); if (txt != null) e.textContent = txt; if (c) e.className = c; return e; };
    const btn = (t, f, c = "ghost") => { const b = el("button", t, "btn sm " + c); b.type = "button"; b.onclick = f; return b; };
    const input = (type, value, placeholder) => { const i = el("input"); i.type = type; if (value != null) i.value = value; if (placeholder) i.placeholder = placeholder; return i; };
    const field = (label, inp) => { const w = el("label", null, "field"); w.append(label, inp); return w; };
    const empty = t => el("p", t, "empty");
    const toCents = v => Math.round(parseFloat(String(v).replace(",", ".")) * 100);
    const fmtPhone = p => p.length === 11 ? `(${p.slice(0, 2)}) ${p.slice(2, 7)}-${p.slice(7)}` : `(${p.slice(0, 2)}) ${p.slice(2, 6)}-${p.slice(6)}`;

    async function boot() {
      const { data: { session } } = await sb.auth.getSession();
      $("#login").hidden = !!session;
      $("#app").hidden = !session;
      $("#out").hidden = !session;
      if (session) show("ag");
    }

    $("#login").onsubmit = async e => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: $("#em").value, password: $("#pw").value });
      if (error) { $("#msg").textContent = "E-mail ou senha incorretos."; $("#msg").classList.add("on"); }
      else boot();
    };
    $("#out").onclick = async () => {
      // "local" apaga a sessão neste aparelho mesmo se a internet falhar
      await sb.auth.signOut({ scope: "local" }).catch(() => {});
      $("#pw").value = "";
      $("#msg").classList.remove("on");
      boot();
    };

    document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => show(b.dataset.t));
    function show(t) {
      ["ag", "cal", "hr", "sv", "lb"].forEach(i => $("#" + i).hidden = i !== t);
      document.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-selected", b.dataset.t === t));
      ({ ag, cal, hr, sv, lb })[t]();
    }

    // ---------- Agenda ----------
    async function ag() {
      const s = $("#ag");
      const { data, error } = await sb.from("bookings").select("*,services(name)")
        .in("status", ["pendente", "confirmado"]).order("day").order("at_time");
      s.textContent = "";
      if (error) { s.append(empty("Não foi possível carregar a agenda.")); return; }
      if (!data.length) { s.append(empty("Nenhum agendamento em aberto.")); return; }

      let lastDay = null;
      data.forEach(b => {
        if (b.day !== lastDay) {
          lastDay = b.day;
          const dow = new Date(b.day + "T12:00:00Z").getUTCDay();
          s.append(el("h3", `${DIAS[dow]}, ${fmtDay(b.day)}`));
        }
        s.append(bookingCard(b, ag));
      });
    }

    // Cartão de um agendamento (usado na Agenda e no Calendário)
    const ABERTOS = ["pendente", "confirmado"];
    function bookingCard(b, refresh) {
      const c = el("div", null, "card booking" + (ABERTOS.includes(b.status) ? "" : " closed"));
      const who = el("div", b.client_name, "who");
      who.append(el("span", b.status, "badge " + b.status));
      const meta = el("div", `${b.services ? b.services.name : "Serviço"} · `, "meta");
      if (/^0+$/.test(b.client_phone)) meta.append("dados anonimizados");
      else {
        const wa = el("a", fmtPhone(b.client_phone));
        wa.href = `https://wa.me/55${b.client_phone}`; wa.target = "_blank"; wa.rel = "noopener";
        meta.append(wa);
      }
      const info = el("div"); info.append(who, meta);

      const up = st => async () => { await sb.from("bookings").update({ status: st }).eq("id", b.id); refresh(); };
      const actions = el("div", null, "actions");
      if (ABERTOS.includes(b.status)) {
        if (b.status === "pendente") actions.append(btn("Confirmar", up("confirmado"), ""));
        actions.append(
          btn("Atendido", up("atendido")),
          btn("Remarcar", async () => {
            const d = prompt("Nova data (AAAA-MM-DD)", b.day);
            const h = prompt("Novo horário (HH:MM)", b.at_time.slice(0, 5));
            if (!d || !h) return;
            const { error } = await sb.from("bookings").update({ day: d, at_time: h }).eq("id", b.id);
            if (error) alert("Horário já ocupado ou inválido.");
            refresh();
          }),
          btn("Cancelar", up("cancelado"))
        );
      }
      actions.append(btn("Excluir", async () => {
        if (confirm("Excluir definitivamente?")) { await sb.from("bookings").delete().eq("id", b.id); refresh(); }
      }, "ghost danger"));
      c.append(el("div", b.at_time.slice(0, 5), "time"), info, actions);
      return c;
    }

    // ---------- Calendário (qualquer mês, todos os atendimentos) ----------
    const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const hojeISO = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
    const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    let calY = +hojeISO().slice(0, 4), calM = +hojeISO().slice(5, 7) - 1, calSel = hojeISO();

    async function cal() {
      const s = $("#cal");
      const ini = iso(calY, calM, 1), nDias = new Date(Date.UTC(calY, calM + 1, 0)).getUTCDate(), fim = iso(calY, calM, nDias);
      const [{ data, error }, { data: folgas }] = await Promise.all([
        sb.from("bookings").select("*,services(name)").gte("day", ini).lte("day", fim).order("day").order("at_time"),
        sb.from("days_off").select("day").gte("day", ini).lte("day", fim)
      ]);
      s.textContent = "";
      if (error) { s.append(empty("Não foi possível carregar o calendário.")); return; }
      const porDia = {};
      (data || []).forEach(b => (porDia[b.day] = porDia[b.day] || []).push(b));
      const off = new Set((folgas || []).map(f => f.day));

      // Cabeçalho do mês
      const nav = el("div", null, "cal-nav");
      const mudar = d => () => { calM += d; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } cal(); };
      nav.append(btn("‹", mudar(-1)), el("b", `${MESES[calM]} ${calY}`), btn("›", mudar(1)));
      const hoje = btn("Hoje", () => { calY = +hojeISO().slice(0, 4); calM = +hojeISO().slice(5, 7) - 1; calSel = hojeISO(); cal(); });
      nav.append(hoje);

      // Grade
      const grid = el("div", null, "cal-grid");
      ["D", "S", "T", "Q", "Q", "S", "S"].forEach(d => grid.append(el("span", d, "cal-dow")));
      const offset = new Date(Date.UTC(calY, calM, 1)).getUTCDay();
      for (let i = 0; i < offset; i++) grid.append(el("span"));
      for (let d = 1; d <= nDias; d++) {
        const dia = iso(calY, calM, d), lista = porDia[dia] || [];
        const abertos = lista.filter(b => ABERTOS.includes(b.status)).length;
        const outros = lista.length - abertos;
        const cell = el("button", null, "cal-day");
        cell.type = "button";
        if (dia === hojeISO()) cell.classList.add("today");
        if (dia === calSel) cell.classList.add("sel");
        if (off.has(dia)) cell.classList.add("off");
        cell.append(el("span", String(d), "n"));
        const dots = el("span", null, "dots");
        if (abertos) dots.append(el("i", String(abertos), "open"));
        if (outros) dots.append(el("i", String(outros), "done"));
        cell.append(dots);
        cell.onclick = () => { calSel = dia; cal(); };
        grid.append(cell);
      }

      const legenda = el("p", null, "hint cal-legend");
      legenda.innerHTML = '<i class="open"></i> em aberto &nbsp; <i class="done"></i> atendidos/cancelados &nbsp; <i class="offk"></i> folga';
      s.append(nav, grid, legenda);

      // Lista do dia escolhido
      if (calSel.slice(0, 7) === ini.slice(0, 7)) {
        const dow = new Date(calSel + "T12:00:00Z").getUTCDay();
        s.append(el("h3", `${DIAS[dow]}, ${fmtDay(calSel)}`));
        if (off.has(calSel)) s.append(el("p", "Dia bloqueado (sem atendimento).", "hint"));
        const lista = porDia[calSel] || [];
        if (!lista.length) s.append(empty("Nenhum atendimento neste dia."));
        lista.forEach(b => s.append(bookingCard(b, cal)));
      }
    }

    // ---------- Horários ----------
    async function hr() {
      const s = $("#hr");
      const [{ data: w }, { data: o }] = await Promise.all([
        sb.from("weekly_hours").select("*").order("at_time"),
        sb.from("days_off").select("*").order("day")
      ]);
      s.textContent = "";
      s.append(el("p", "Horários que aparecem para as clientes em cada dia da semana.", "sub"));

      DIAS.forEach((n, d) => {
        const c = el("div", null, "card");
        c.append(el("b", n));
        const chips = el("div", null, "chips");
        const doDia = (w || []).filter(x => x.weekday === d);
        if (!doDia.length) chips.append(el("span", "Sem atendimento", "hint"));
        doDia.forEach(x => chips.append(btn(x.at_time.slice(0, 5) + "  ✕", async () => {
          await sb.from("weekly_hours").delete().match({ weekday: d, at_time: x.at_time }); hr();
        })));
        const i = input("time");
        const row = el("div", null, "row");
        row.append(i, btn("Adicionar", async () => {
          if (i.value) { await sb.from("weekly_hours").insert({ weekday: d, at_time: i.value }); hr(); }
        }, ""));
        c.append(chips, row);
        s.append(c);
      });

      s.append(el("h3", "Dias sem atendimento"));
      const c = el("div", null, "card");
      const chips = el("div", null, "chips");
      if (!(o || []).length) chips.append(el("span", "Nenhum dia bloqueado.", "hint"));
      (o || []).forEach(x => chips.append(btn(fmtDay(x.day) + "  ✕", async () => {
        await sb.from("days_off").delete().eq("day", x.day); hr();
      })));
      const i = input("date");
      const row = el("div", null, "row");
      row.append(i, btn("Bloquear dia", async () => {
        if (i.value) { await sb.from("days_off").upsert({ day: i.value }); hr(); }
      }, ""));
      c.append(chips, row);
      s.append(c);
    }

    // ---------- Serviços ----------
    async function sv() {
      const s = $("#sv");
      const { data } = await sb.from("services").select("*").order("id");
      s.textContent = "";
      s.append(el("p", "Serviços ocultos não aparecem para as clientes.", "sub"));

      (data || []).forEach(x => {
        const c = el("div", null, "card");
        const n = input("text", x.name), p = input("text", (x.price_cents / 100).toFixed(2).replace(".", ","));
        const m = input("number", x.duration_min); m.min = 15; m.step = 15;
        p.inputMode = "decimal";
        const row = el("div", null, "svc-row" + (x.active ? "" : " off"));
        row.append(field("Nome", n), field("Preço (R$)", p), field("Minutos", m));
        const actions = el("div", null, "row");
        actions.append(
          btn("Salvar", async () => {
            await sb.from("services").update({ name: n.value.trim(), price_cents: toCents(p.value), duration_min: parseInt(m.value) || 60 }).eq("id", x.id);
            sv();
          }, ""),
          btn(x.active ? "Ocultar" : "Mostrar", async () => { await sb.from("services").update({ active: !x.active }).eq("id", x.id); sv(); })
        );
        c.append(row, actions);
        s.append(c);
      });

      s.append(el("h3", "Novo serviço"));
      const c = el("div", null, "card");
      const n = input("text", null, "Ex.: Esmaltação"), p = input("text", null, "45,00"), m = input("number", 60);
      m.min = 15; m.step = 15; p.inputMode = "decimal";
      const row = el("div", null, "svc-row");
      row.append(field("Nome", n), field("Preço (R$)", p), field("Minutos", m));
      c.append(row, btn("Adicionar serviço", async () => {
        if (!n.value.trim() || isNaN(toCents(p.value))) { alert("Preencha nome e preço."); return; }
        await sb.from("services").insert({ name: n.value.trim(), price_cents: toCents(p.value), duration_min: parseInt(m.value) || 60 });
        sv();
      }, ""));
      s.append(c);
    }

    // ---------- Avisos (lembretes no Telegram) ----------
    async function lb() {
      const s = $("#lb");
      const { data: cfg, error } = await sb.from("reminder_settings").select("*").eq("id", 1).single();
      s.textContent = "";
      if (error) { s.append(empty("Não foi possível carregar os avisos.")); return; }
      const conectado = !!cfg.tg_chat_id;
      s.append(el("p", "Receba no Telegram um aviso 1 hora e 30 minutos antes de cada atendimento.", "sub"));

      const status = el("div", null, "msg");
      const say = (t, ok) => { status.textContent = t; status.classList.add("on"); status.style.background = ok ? "var(--ok-soft)" : ""; status.style.color = ok ? "var(--ok)" : ""; };
      const espera = ms => new Promise(r => setTimeout(r, ms));
      // Pergunta ao banco o resultado de uma chamada ao Telegram (ela leva 1–3 s)
      async function resultado(fn, id) {
        for (let k = 0; k < 10; k++) {
          await espera(1200);
          const { data: r } = await sb.rpc(fn, { p_id: id });
          if (r && r !== "aguardando") return r;
        }
        return "sem_resposta";
      }

      // Situação atual
      const sit = el("div", null, "card");
      sit.append(el("b", conectado ? "✅ Telegram conectado" : "Telegram ainda não conectado"));
      if (conectado) {
        const on = el("input"); on.type = "checkbox"; on.checked = cfg.enabled;
        const toggle = el("label", null, "legal"); toggle.append(on, el("span", "Avisos ligados"));
        on.onchange = async () => { await sb.from("reminder_settings").update({ enabled: on.checked }).eq("id", 1); say(on.checked ? "Avisos ligados." : "Avisos desligados.", true); };
        const acoes = el("div", null, "row");
        acoes.append(
          btn("Enviar teste", async () => {
            say("Enviando…", true);
            const { data: id, error } = await sb.rpc("test_reminder");
            if (error || !id) { say("Não foi possível enviar."); return; }
            const r = await resultado("reminder_status", id);
            if (r.startsWith("200")) say("Mensagem de teste enviada! Confira o Telegram.", true);
            else say("O Telegram não aceitou o envio. Refaça a conexão abaixo.");
          }, ""),
          btn("Desconectar", async () => {
            if (!confirm("Parar de receber os avisos no Telegram?")) return;
            await sb.from("reminder_settings").update({ tg_chat_id: "", enabled: false }).eq("id", 1); lb();
          }, "ghost danger")
        );
        sit.append(toggle, acoes);
      }
      sit.append(status);
      s.append(sit);

      // Passo a passo para conectar (uma vez só)
      const guia = el("div", null, "card");
      guia.append(el("b", conectado ? "Conectar outro Telegram" : "Como conectar (só uma vez)"));
      const ol = el("ol", null, "guide");
      const li1 = el("li", "No Telegram, abra o ");
      const bf = el("a", "@BotFather"); bf.href = "https://t.me/BotFather"; bf.target = "_blank"; bf.rel = "noopener";
      li1.append(bf, ", mande /newbot e escolha um nome (ex.: Agenda Glauciane) e um usuário terminado em bot (ex.: agendaglauciane_bot).");
      ol.append(li1,
        el("li", "Ele responde com um token (uma linha longa com números e letras). Copie e cole abaixo."),
        el("li", "Abra o seu robô novo no Telegram (pelo link que o BotFather mandou) e toque em Iniciar."),
        el("li", "Volte aqui e toque em Conectar."));
      guia.append(ol);

      const tok = input("text", cfg.tg_token, "123456789:ABC...");
      tok.autocomplete = "off"; tok.spellcheck = false;
      const msgC = el("div", null, "msg");
      const sayC = (t, ok) => { msgC.textContent = t; msgC.classList.add("on"); msgC.style.background = ok ? "var(--ok-soft)" : ""; msgC.style.color = ok ? "var(--ok)" : ""; };
      const conectar = btn("Conectar", async () => {
        const t = tok.value.trim();
        if (!/^\d+:[\w-]{20,}$/.test(t)) { sayC("Esse token não parece certo. Copie a linha inteira que o BotFather mandou."); return; }
        sayC("Conectando…", true);
        await sb.from("reminder_settings").update({ tg_token: t }).eq("id", 1);
        const { data: id, error } = await sb.rpc("tg_connect");
        if (error || !id) { sayC("Não foi possível falar com o Telegram."); return; }
        const r = await resultado("tg_finish", id);
        if (r.startsWith("ok:")) {
          sayC(`Conectado${r.slice(3) ? " com " + r.slice(3) : ""}! Enviando um teste…`, true);
          const { data: tid } = await sb.rpc("test_reminder");
          if (tid) await resultado("reminder_status", tid);
          lb();
        }
        else if (r === "token_invalido") sayC("O Telegram não reconheceu esse token. Confira se copiou a linha inteira.");
        else if (r === "sem_mensagem") sayC("Falta o passo 3: abra o seu robô no Telegram, toque em Iniciar e tente de novo.");
        else sayC("O Telegram demorou a responder. Tente de novo em instantes.");
      }, "");
      guia.append(field("Token do robô", tok), conectar, msgC);
      s.append(guia);
    }

    boot();
  </script>
</body>
</html>
